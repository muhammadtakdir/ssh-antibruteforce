# ==============================================================================
# Linux SSH Hardening Baseline (Ubuntu / Debian, OpenSSH >= 8.2)
# Lokasi file target: /etc/ssh/sshd_config.d/00-ssh-hardening.conf
#
# CATATAN PENTING: sshd memakai nilai PERTAMA yang ditemukan untuk tiap opsi.
# File drop-in dibaca berurutan abjad, sehingga file ini diberi awalan "00-"
# agar tidak dikalahkan oleh drop-in bawaan seperti 50-cloud-init.conf
# (yang sering berisi "PasswordAuthentication yes").
#
# harden_ssh.sh menyesuaikan baris KexAlgorithms dan PerSourceMaxStartups
# dengan versi OpenSSH di server. Bila memasang manual pada OpenSSH < 8.5,
# hapus PerSourceMaxStartups dan algoritma kex yang tidak didukung
# (cek dengan: ssh -Q kex), lalu uji dengan: sshd -t
# ==============================================================================

# 1. Nonaktifkan Akses Root Langsung (Wajib Gunakan Akun Biasa + Sudo)
PermitRootLogin no

# 2. Kunci Otentikasi Hanya Menggunakan Kunci Kriptografi (Matikan Password)
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AuthenticationMethods publickey

# 3. Batasan Percobaan, Durasi Sesi & Anti-Scanning di Level Daemon
#    (koneksi bot diputus pada fase [preauth] tanpa menambah aturan firewall)
MaxAuthTries 3
MaxStartups 50:30:100
PerSourceMaxStartups 2
LoginGraceTime 30

# 4. Kriptografi Kuat & Modern (Kex, Ciphers, MACs)
#    Kex post-quantum (ML-KEM / sntrup761) diutamakan bila didukung OpenSSH.
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# 5. Pemeliharaan Sesi & Anti-Hanging
ClientAliveInterval 300
ClientAliveCountMax 2

# 6. Matikan Fitur yang Tidak Diperlukan
#    (AllowTcpForwarding no juga mematikan ProxyJump & tunnel "ssh -L";
#     lihat README bagian Pengecualian bila fitur tersebut dibutuhkan)
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
